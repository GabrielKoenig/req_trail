# One file per project, at projects/<project>/project.yml.
# Hats (owners, tech leads and the rest) live in roles.yml, the single source for them, never here.
name: <project>          # the code repo's name in lower snake case; also the folder name and part of every ID
description: <one sentence on what the code repo does>
code_repos:
  - <organisation>/<repo>
