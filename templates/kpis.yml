# Measured outcomes, at projects/<project>/kpis.yml: one entry per value review, added by pull request.
# About six weeks after a release, the owner compares the feature's metric with its baseline and target.
- feature: ft_<project>_<nn>
  release: "<release>"
  date: <yyyy-mm-dd>
  value: <measured value>
  source: <where the value comes from>
  decision: solved               # solved, partly or not_solved; partly and not_solved open a new request
