      <path d="M-5.1 0L-1.07 -4.03H6.08V4.03H-1.07Z" stroke="#a67c00" stroke-width="1.4"/>
    </g>
  </g>
  <circle cx="37.84" cy="47" r="5.2" fill="#a67c00"/>
