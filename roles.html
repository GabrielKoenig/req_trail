/* Layout: one tabbed dashboard in the look of the concept page (gold on dark, dark only). Hats on the left, time on the right. */
:root{

*{box-sizing:border-box}

.dot{width:10px;height:10px;border-radius:50%;background:var(--gold-d)}
.crumb{color:var(--g09)}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

.lead{font-size:16px;color:var(--g12);max-width:70ch;margin:0}

h3.sh{font-size:17px;margin:28px 0 8px}
.sub{color:var(--g12);max-width:80ch;margin:0 0 16px}

.note{color:var(--g09);font-size:12.5px;margin:10px 0 0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}

.btn,select.sel,input.sel,textarea.sel{font:inherit;font-size:13px;color:var(--g14);background:var(--g03);border:1px solid var(--g04);padding:6px 12px;border-radius:6px;max-width:100%}

.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin:0 0 14px}

.att{list-style:none;margin:0;padding:0}
.att li{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 12px;margin-bottom:8px;min-width:0}
.att li>span:last-child{min-width:0;overflow-wrap:anywhere}
.ev{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:12px 14px;margin-bottom:10px;min-width:0}
.ev .h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ev .h b{font-size:14px}
.ev .d{color:var(--g09);font-size:12.5px}
.ev .why{color:var(--g12);margin:6px 0 8px;overflow-wrap:anywhere}
.cl{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:3px 0;color:var(--g12);font-size:13px}
.sg{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-weight:700;font-size:13px}
.sg.p{background:rgba(105,191,136,.18);color:var(--green)}
.sg.m{background:rgba(223,67,95,.18);color:var(--red)}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fm .f{min-width:0}
.fm label{display:block;font-size:11.5px;color:var(--g09);margin-bottom:3px}
.fm .wide{grid-column:1/-1}
.res{margin:14px 0 0;padding:0;list-style:none}
.res li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;color:var(--g12);overflow-wrap:anywhere}
.res .ic{flex:none;width:18px;text-align:center;font-weight:700}
.res .ic.f{color:var(--red)}.res .ic.w{color:var(--yellow)}.res .ic.i{color:var(--blue10)}.res .ic.o{color:var(--green)}
pre.diff{margin:12px 0 0;background:var(--g01);border:1px solid var(--g04);border-radius:8px;padding:10px 12px;overflow-x:auto;font:12.5px/1.5 var(--mono);color:var(--g12)}
pre.diff .a{color:var(--green)}pre.diff .d{color:var(--red)}pre.diff .c{color:var(--g09)}
.loop{margin-top:12px;border:1px dashed var(--gold);border-radius:10px;padding:10px 14px;background:rgba(240,185,11,.06);color:var(--g12);font-size:13px}
.flowl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.flowl li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12.5px;color:var(--g12);min-width:0;counter-increment:s}
.flowl li b{display:block;color:var(--g14);font-size:13.5px;margin-bottom:4px}
.flowl li::before{content:counter(s);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--grad);color:#1a1400;font-weight:700;font-size:12px;margin-bottom:8px}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);color:var(--g09);font-size:12.5px;max-width:110ch}
footer p{margin:0 0 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--g05);color:#fff;border:1px solid var(--g06);padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;max-width:calc(100% - 32px);z-index:5}
.toast.on{opacity:1}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}h1{font-size:30px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

    ["G3 Verified and accepted","G3 Verify and accept","pTook","One gate with two keys: evidence and acceptance. Acceptance is blocked for a developer of the feature."],
    ["7 Release","7 Release","pTook","A tag, a ZIP and release notes from the Implements lines. No environments, feature flags or deployment evidence."],
    ["8 Monitoring","Value review","pLeft","Replaced by the review about six weeks after the release. No error, latency or availability monitoring."],
    ["G4 Value confirmed","Value review (not a gate)","pTook","A review that blocks nothing. The result goes into kpis.yml by pull request."],
    ["9 Change request","9 Change request","pTook","Same, with editorial versus substantive changes."],
    ["10 Retrospective","Not a phase","pLeft","The Gates view and the value review already show where it hurts. A short look back after the pilot is enough."]
  ];

  /* ---------- rendering ---------- */
  var view="overview";
  function chip(w,inh){return '<span class="chip'+(inh?' inh':'')+'" title="'+esc(PEOPLE[w]||w)+'">@'+esc(w)+'</span>'}
  function hn(id){return tr(HM[id].n)}
  function tagK(k){var cls={decides:"o",does:"v",asked:"gr",told:"gr",check:"g"}[k]||"gr"; return '<span class="tagx '+cls+'">'+u({decides:"kDecides",does:"kDoes",asked:"kAsked",told:"kTold",check:"kCheck"}[k])+'</span>'}

  function renderStatic(){
    [].forEach.call(document.querySelectorAll("[data-i]"),function(e){e.textContent=u(e.getAttribute("data-i"))});
    [].forEach.call(document.querySelectorAll("[data-ih]"),function(e){e.innerHTML=u(e.getAttribute("data-ih"))});
    
    document.documentElement.lang=lang;
    $("hwList").innerHTML=["hw1","hw2","hw3","hw4","hw5"].map(function(k){return "<li>"+u(k)+"</li>"}).join("");
    $("hatList").innerHTML=HATS.map(function(h){return "<li><b>"+esc(tr(h.n))+"</b>"+(h.g?' <span class="tagx gr">'+esc(h.g)+"</span>":"")+" "+esc(tr(HATD[h.id]))+"</li>"}).join("");
    $("agList").innerHTML=["ag1","ag2","ag3","ag4","ag5","ag6"].map(function(k){return "<li>"+u(k)+"</li>"}).join("");
    $("notList").innerHTML=["not1","not2","not3","not4"].map(function(k){return "<li>"+u(k)+"</li>"}).join("");
  }

  function scopeOptions(withAll){
    return (withAll?'<option value="">'+esc(u("fAll"))+'</option>':'')+SC.map(function(s){return '<option value="'+s.id+'">'+esc((s.lv==="feature"?"  ":"")+scl(s.id))+"</option>"}).join("");
  }
  function fillSelects(){
    var keep={};
    ["aScope","hScope","hHat","hWho","dHat","dPh","cScope","cHat","cAct","cBy","cOk"].forEach(function(id){keep[id]=$(id).value});
    $("aScope").innerHTML=scopeOptions(false); $("hScope").innerHTML=scopeOptions(true); $("cScope").innerHTML=scopeOptions(false);
    $("hHat").innerHTML='<option value="">'+esc(u("fAll"))+"</option>"+HATS.map(function(h){return '<option value="'+h.id+'">'+esc(tr(h.n))+"</option>"}).join("");
    var pe=Object.keys(PEOPLE).sort();
    $("hWho").innerHTML='<option value="">'+esc(u("fAll"))+"</option>"+pe.map(function(w){return '<option value="'+w+'">@'+w+"</option>"}).join("");
    $("dHat").innerHTML='<option value="">'+esc(u("fAll"))+"</option>"+DH.map(function(h){return '<option value="'+h.id+'">'+esc(tr(h.n))+"</option>"}).join("");
    $("dPh").innerHTML='<option value="">'+esc(u("fAll"))+"</option>"+PH.map(function(p){return '<option value="'+p.id+'">'+esc(tr(p.n))+"</option>"}).join("");
    $("cAct").innerHTML='<option value="add">'+esc(u("cAdd"))+'</option><option value="remove">'+esc(u("cRem"))+'</option><option value="replace">'+esc(u("cRepl"))+"</option>";
    var po=pe.map(function(w){return '<option value="'+w+'">@'+w+"</option>"}).join("");
    $("cBy").innerHTML=po; $("cOk").innerHTML=po;
    $("cPeople").innerHTML=pe.map(function(w){return '<option value="'+w+'">'}).join("");
    Object.keys(keep).forEach(function(id){ if(keep[id]!==""&&keep[id]!=null){ try{$(id).value=keep[id]}catch(e){} } });
    if(!$("cBy").value) $("cBy").value="owner-a";
    if(!$("cOk").value) $("cOk").value="coord-a";
    fillHatSelect();
  }
  function hatsFor(scopeId){var sc=SM[scopeId]; return HATS.filter(function(h){return h.lv.indexOf(sc.lv)>=0})}
  function fillHatSelect(){
    var cur=$("cHat").value, hs=hatsFor($("cScope").value||"RB");
    $("cHat").innerHTML=hs.map(function(h){return '<option value="'+h.id+'">'+esc(tr(h.n))+"</option>"}).join("");
    if(hs.some(function(h){return h.id===cur})) $("cHat").value=cur;
  }

  function renderOverview(){
    var st=stateAt(TODAY), ck=checks(st), warns=ck.filter(function(c){return c.sev==="warn"});
    var pe={}; st.forEach(function(e){pe[e.w]=1});
    var n30=PRS.filter(function(p){return !p.setup&&p.d>addDays(TODAY,-30)}).length;
    var prj=SC.filter(function(s){return s.lv==="project"}).length, ft=SC.filter(function(s){return s.lv==="feature"}).length;
    $("oTiles").innerHTML=[[prj,u("tPrj"),0],[ft,u("tFeat"),0],[Object.keys(pe).length,u("tPpl"),0],[warns.length,u("tWarn"),warns.length?1:0],[n30,u("tChg"),0]].map(function(t){return '<div class="kpi'+(t[2]?" hl":"")+'"><div class="n">'+t[0]+'</div><div class="l">'+esc(t[1])+"</div></div>"}).join("");
    $("oAtt").innerHTML=ck.length?ck.map(function(c){return '<li><span class="tagx '+(c.sev==="warn"?"y":"v")+'">'+(c.sev==="warn"?"!":"i")+"</span><span>"+esc(ckMsg(c))+"</span></li>"}).join(""):"<li>"+esc(u("oAttNone"))+"</li>";
    var bad={}; warns.forEach(function(c){bad[c.s+"|"+c.r]=1});
    var head="<thead><tr><th>"+esc(u("fScope"))+"</th>"+HATS.map(function(h){return "<th>"+esc(tr(h.n))+'<span class="sub-n">'+esc(h.g||" ")+"</span></th>"}).join("")+"</tr></thead>";
    var body=SC.map(function(sc){
      return '<tr class="'+(sc.lv==="feature"?"sc2":"")+'"><td>'+esc(sc.id)+'<span class="sub-n">'+esc(scn(sc))+"</span></td>"+HATS.map(function(h){
        var e=eff(st,sc,h);
        if(e.na) return '<td class="na">·</td>';
        var cell=e.l.length?e.l.map(function(x){return chip(x.w,e.inh)}).join(""):'<span class="tagx '+(h.min>=1?"y":"gr")+'">'+esc(h.min>=1?u("aVac"):"–")+"</span>";
        return '<td class="'+(bad[sc.id+"|"+h.id]?"w":"")+'">'+cell+"</td>";
      }).join("")+"</tr>";
    }).join("");
    $("oMat").innerHTML=head+"<tbody>"+body+"</tbody>";
    var byP={}; st.forEach(function(e){(byP[e.w]=byP[e.w]||[]).push(e)});
    var rows=Object.keys(PEOPLE).sort().map(function(w){
      var es=byP[w]||[], g={};
      es.forEach(function(e){(g[e.r]=g[e.r]||[]).push(e.s)});
      var tags=Object.keys(g).length?HATS.filter(function(h){return g[h.id]}).map(function(h){return '<span class="tagx gr" title="'+esc(g[h.id].join(", "))+'">'+esc(h.id)+" · "+esc(g[h.id].join(", "))+"</span>"}).join(" "):"–";
      return "<tr><td>"+chip(w)+'<span class="sub-n">'+esc(PEOPLE[w])+"</span></td><td>"+tags+"</td></tr>";
    }).join("");
    $("oPpl").innerHTML="<thead><tr><th>"+esc(u("fPerson"))+"</th><th>"+esc(u("fHat"))+"</th></tr></thead><tbody>"+rows+"</tbody>";
  }

  function renderAssign(){
    var sid=$("aScope").value||"RB", sc=SM[sid], date=$("aDate").value||TODAY;
    var st=stateAt(date);
    var head="<thead><tr><th>"+esc(u("aHat"))+"</th><th>"+esc(u("aWho"))+"</th><th>"+esc(u("aGate"))+"</th><th>"+esc(u("aMin"))+"</th></tr></thead>";
    var body=HATS.map(function(h){
      var e=eff(st,sc,h);
      if(e.na) return '<tr><td>'+esc(tr(h.n))+'</td><td class="na" style="text-align:left">'+esc(u("aNa"))+"</td><td></td><td></td></tr>";
      var cell=e.l.length?e.l.map(function(x){
        var meta=x.setup?fmt(u("aSetup"),dfmt(x.since),x.pr):fmt(u("aSince"),dfmt(x.since),x.pr,x.ok);
        return '<div style="margin:3px 0">'+chip(x.w,e.inh)+' <span class="crumb" style="font-size:12px">'+esc(PEOPLE[x.w]||"")+" · "+esc(meta)+"</span></div>";
      }).join("")+(e.inh?'<div class="note" style="margin:4px 0 0">'+esc(fmt(u("aInh"),e.from))+"</div>":""):'<span class="tagx '+(h.min>=1?"y":"gr")+'">'+esc(u("aVac"))+"</span>";
      var low=e.l.length<h.min&&!e.inh;
      return '<tr><td>'+esc(tr(h.n))+'</td><td class="'+(low?"w":"")+'">'+cell+"</td><td>"+esc(h.g)+"</td><td>"+(h.min||"–")+"</td></tr>";
    }).join("");
    $("aTab").innerHTML=head+"<tbody>"+body+"</tbody>";
    $("aNote").textContent=u("aNote");
    $("aSinceH").textContent=fmt(u("aSinceH"),dfmt(date));
    var after=PRS.filter(function(p){return p.d>date}).sort(function(a,b){return a.d<b.d?1:-1}).filter(function(p){return p.c.some(function(c){return c.s===sid||(sc.lv==="project"&&SM[c.s]&&SM[c.s].p===sid)})});
    $("aSince").innerHTML=after.length?after.map(evCard).join(""):'<p class="note">'+esc(u("aSinceNone"))+"</p>";
  }

  function evCard(p,hl){
    var lines=p.c.map(function(c){
      return '<div class="cl"><span class="sg '+(c.op==="+"?"p":"m")+'">'+(c.op==="+"?"+":"−")+"</span>"+chip(c.w)+'<span>'+esc(hn(c.r))+'</span><span class="crumb">· '+esc(scl(c.s))+"</span></div>";
    }).join("");
    var ap=p.setup?'<span class="tagx gr">'+esc(u("hSetup"))+"</span>":'<span class="tagx g">'+esc(fmt(u("hOk"),p.ok))+"</span>";
    return '<div class="ev"><div class="h"><b>PR #'+p.id+'</b><span class="d">'+esc(dfmt(p.d))+" · "+esc(fmt(u("hBy"),p.by))+"</span>"+ap+(p.sim?' <span class="tagx v">'+esc(u("hSim"))+"</span>":"")+'</div><div class="why">'+esc(tr(p.why))+"</div>"+lines+"</div>";
  }
  function renderHistory(){
    var fs=$("hScope").value, fh=$("hHat").value, fw=$("hWho").value, q=($("hQ").value||"").toLowerCase();
    var list=PRS.slice().sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:b.id-a.id}).filter(function(p){
      if(q&&(tr(p.why)||"").toLowerCase().indexOf(q)<0) return false;
      return p.c.some(function(c){return (!fs||c.s===fs||(SM[c.s].p===fs))&&(!fh||c.r===fh)&&(!fw||c.w===fw)});
    });
    var n=list.reduce(function(a,p){return a+p.c.length},0);
    $("hCount").textContent=fmt(u("hCount"),list.length,n);
    $("hList").innerHTML=list.length?list.map(evCard).join(""):'<p class="note">'+esc(u("hNone"))+"</p>";
  }

  function renderDuties(){
    var fh=$("dHat").value, fp=$("dPh").value;
    var rows=DUTIES.filter(function(d){return (!fh||d[1]===fh)&&(!fp||d[0]===fp)});
    var phName={}; PH.forEach(function(p){phName[p.id]=tr(p.n)});
    $("dTab").innerHTML="<thead><tr><th>"+esc(u("dPh"))+"</th><th>"+esc(u("dHat"))+"</th><th>"+esc(u("dKey"))+"</th><th>"+esc(u("dDuty"))+"</th></tr></thead><tbody>"+rows.map(function(d){
      return "<tr><td>"+esc(phName[d[0]])+"</td><td>"+esc(tr(DM[d[1]].n))+"</td><td>"+tagK(d[2])+"</td><td>"+esc(tr(d[3]))+"</td></tr>";
    }).join("")+"</tbody>";
  }

  function mapTable(id,rows){
    $(id).innerHTML="<thead><tr><th>"+esc(u("pRole"))+"</th><th>"+esc(u("pOurs"))+"</th><th></th><th>"+esc(u("pWhy"))+"</th></tr></thead><tbody>"+rows.map(function(r){
      var cls={pTook:"g",pMerged:"v",pSplit:"v",pLeft:"gr",pAdded:"o"}[r[2]];
      return "<tr><td>"+esc(r[0])+"</td><td>"+esc(tr(r[1]))+'</td><td><span class="tagx '+cls+'">'+esc(u(r[2]))+"</span></td><td>"+esc(tr(r[3]))+"</td></tr>";
    }).join("")+"</tbody>";
  }

  /* ---------- change form ---------- */
  var lastVal=null;
  function ymlBlock(c){
    var h=HM[c.h], sc=SM[c.s], proj=sc.lv==="feature"?sc.p:(sc.lv==="project"?sc.id:"(repo)");
    return {path:sc.lv==="repo"?".github/roles.yml":"projects/"+proj+"/roles.yml",key:(sc.lv==="feature"?"features."+sc.id+".":"")+h.y};
  }
  function validate(){
    var sid=$("cScope").value, hid=$("cHat").value, act=$("cAct").value, who=($("cWho").value||"").trim().toLowerCase().replace(/^@/,""), to=($("cTo").value||"").trim().toLowerCase().replace(/^@/,"");
    var by=$("cBy").value, ok=$("cOk").value, why=($("cWhy").value||"").trim();
    var res=[], fails=0, sc=SM[sid], h=HM[hid];
    if(!sc||!h) return {res:[],fails:1,diff:""};
    var st=stateAt(TODAY), cur=names(ent(st,sid,hid)), after=cur.slice(), changes=[];
    var re=/^[a-z0-9][a-z0-9-]{1,38}$/;
    function add(sev,msg){res.push([sev,msg]); if(sev==="f") fails++}
    if(!who){add("f",u(act==="add"?"rWho1":"rWho0"))}
    else if(!re.test(who)){add("f",u("rHandle"))}
    else if(act==="add"){
      if(cur.indexOf(who)>=0) add("f",fmt(u("rDup"),who)); else {after.push(who); changes.push({s:sid,h:hid,op:"+",w:who})}
    } else {
      if(cur.indexOf(who)<0) add("f",fmt(u("rWho2"),who,cur.length?cur.map(function(x){return "@"+x}).join(", "):"–"));
      else {
        after=after.filter(function(x){return x!==who}); changes.push({s:sid,h:hid,op:"-",w:who});
        if(act==="replace"){
          if(!to||!re.test(to)) add("f",u("rHandle"));
          else if(after.indexOf(to)>=0||to===who) add("f",fmt(u("rDup"),to));
          else {after.push(to); changes.push({s:sid,h:hid,op:"+",w:to})}
        }
      }
    }
    var newbie=(act==="add"?who:(act==="replace"?to:"")); if(newbie&&re.test(newbie)&&!PEOPLE[newbie]) add("i",fmt(u("rNew"),newbie));
    if(changes.length){
      var own=sc.lv==="feature"&&h.lv.indexOf("feature")>=0;
      if(h.min>=2&&after.length<h.min&&!(own&&after.length===0)) add("f",fmt(u("rMin"),tr(h.n),after.length,h.min));
      else if(h.min>=1&&after.length===0&&!(sc.lv==="feature")) add("f",fmt(u("rEmpty"),tr(h.n)));
      if(sc.lv==="feature"&&!cur.length&&after.length){var inh=names(ent(st,sc.p,hid)); add("w",fmt(u("rOwn"),sid,inh.length?inh.map(function(x){return "@"+x}).join(", "):"–"))}
      if(sc.lv==="feature"&&cur.length&&!after.length) add("i",u("rBack"));
    }
    if(by===ok) add("f",u("rSelf"));
    var proj=sc.lv==="feature"?sc.p:(sc.lv==="project"?sc.id:null), okSet=st.filter(function(e){return (e.r==="RO"||e.r==="PL")&&e.w===ok&&(!proj||e.s===proj)});
    if(!okSet.length) add("f",fmt(u("rApprover"),ok,proj||"project_management"));
    if(why.length<5) add("f",u("rWhy"));
    if(changes.length){
      var fake={id:nextPr,d:TODAY,by:by,ok:ok,why:[why,why],c:changes.map(function(c){return {s:c.s,r:c.h,op:c.op,w:c.w}})};
      var old=checks(st), nw=checks(stateAt(TODAY,[fake])), oldK={}; old.forEach(function(c){oldK[ckKey(c)]=1});
      nw.filter(function(c){return (c.k==="cTd"||c.k==="cPe"||c.k==="cArch")&&!oldK[ckKey(c)]}).forEach(function(c){add("w",fmt(u("rTd"),ckMsg(c)))});
    }
    if(!fails&&changes.length) res.unshift(["o",u("rOk")]);
    var diff="";
    if(changes.length){
      var b=ymlBlock({s:sid,h:hid}), keepAfter=after.slice();
      diff='<span class="c">'+esc(b.path)+"\n  "+esc(b.key)+":</span>\n";
      cur.forEach(function(x){ diff+= keepAfter.indexOf(x)>=0?"    - "+esc(x)+"\n":'<span class="d">-   - '+esc(x)+"</span>\n"});
      after.forEach(function(x){ if(cur.indexOf(x)<0) diff+='<span class="a">+   - '+esc(x)+"   # "+TODAY+", PR #"+nextPr+"</span>\n"});
      if(!after.length) diff+='<span class="c">    []</span>\n';
    }
    return {res:res,fails:fails,diff:diff,changes:changes,fake:changes.length?{id:nextPr,d:TODAY,by:by,ok:ok,why:[why,why],c:changes.map(function(c){return {s:c.s,r:c.h,op:c.op,w:c.w}}),sim:1}:null};
  }
  function renderChange(){
    var a=$("cAct").value;
    $("cWhoL").textContent=u(a==="add"?"cWhoAdd":(a==="remove"?"cWhoRem":"cWhoRep"));
    $("cToBox").hidden=a!=="replace";
    var v=validate(); lastVal=v;
    var icon={f:["✕","f"],w:["!","w"],i:["i","i"],o:["✓","o"]};
    $("cRes").innerHTML=v.res.map(function(r){return '<li><span class="ic '+icon[r[0]][1]+'">'+icon[r[0]][0]+"</span><span>"+esc(r[1])+"</span></li>"}).join("");
    $("cDiff").innerHTML=v.diff||'<span class="c">'+esc(u("rNoDiff"))+"</span>";
    $("cMerge").disabled=!(v.changes&&v.changes.length&&!v.fails);
  }

  function renderAll(){
    renderStatic(); fillSelects();
    mapTable("pRoles",MAPR); mapTable("pPh",MAPP);
    renderOverview(); renderAssign(); renderHistory(); renderDuties(); renderChange();
    showView();
  }
  function showView(){
    var h=(location.hash||"").replace("#","");
    var ok=["overview","assignments","history","duties","change","adapted"];
    view=ok.indexOf(h)>=0?h:"overview";
    [].forEach.call(document.querySelectorAll("[data-view]"),function(s){s.hidden=s.getAttribute("data-view")!==view});
    [].forEach.call(document.querySelectorAll("#tabs a"),function(a){if(a.getAttribute("data-v")===view) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current")});
  }

  /* ---------- events ---------- */
  function setLang(l){lang=l; try{localStorage.setItem(KEY,l)}catch(e){} renderAll()}
  
  window.addEventListener("hashchange",showView);
  $("aScope").addEventListener("change",renderAssign); $("aDate").addEventListener("change",renderAssign);
  $("aToday").addEventListener("click",function(){$("aDate").value=TODAY; renderAssign()});
  ["hScope","hHat","hWho"].forEach(function(id){$(id).addEventListener("change",renderHistory)}); $("hQ").addEventListener("input",renderHistory);
  ["dHat","dPh"].forEach(function(id){$(id).addEventListener("change",renderDuties)});
  $("cScope").addEventListener("change",function(){fillHatSelect(); renderChange()});
  ["cHat","cAct","cBy","cOk"].forEach(function(id){$(id).addEventListener("change",renderChange)});
  ["cWho","cTo","cWhy"].forEach(function(id){$(id).addEventListener("input",renderChange)});
  $("cMerge").addEventListener("click",function(){
    var v=validate(); if(v.fails||!v.fake) return;
    v.fake.id=nextPr; PRS.push(v.fake); nextPr++;
    $("cWho").value=""; $("cTo").value=""; $("cWhy").value="";
    renderOverview(); renderAssign(); renderHistory(); renderChange();
    toast(fmt(u("rMerged"),v.fake.id));
  });
  $("cReset").addEventListener("click",function(){seed(); $("cWho").value=""; $("cTo").value=""; $("cWhy").value=""; renderOverview(); renderAssign(); renderHistory(); renderChange(); toast(u("rReset"))});

  seed();
  $("aDate").value=TODAY; $("aDate").max=TODAY;
  renderAll();
  $("aScope").value="FT-RB-02"; renderAssign();
  // a realistic first state of the form: give the project_management tooling its second owner
  $("cScope").value="RB"; fillHatSelect(); $("cHat").value="TEST"; $("cAct").value="add"; $("cWho").value="lead-b";
  $("cBy").value="owner-a"; $("cOk").value="coord-a"; $("cWhy").value="A third tester, so the evidence at G3 never waits on one person.";
  renderChange();
  window.__roles={miss:function(){return MISS.slice()},state:stateAt,checks:checks,prs:function(){return PRS},lang:function(){return lang}};
})();
</script>
